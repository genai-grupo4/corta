<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: acortador interno</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <img src="logo.png" alt="Corta" class="logo">
    <h1>Corta</h1>
    <p class="sub">El acortador de URLs interno</p>

    <form id="form">
      <input type="url" id="url" placeholder="https://una-url-muy-larga..." required>
      <button type="submit">Acortar</button>
    </form>

    <p id="mensaje" class="mensaje error oculto"></p>

    <div id="resultado" class="oculto">
      <p>Tu link corto:</p>
      <a id="link-corto" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button id="copiar" type="button">Copiar</button>
    </div>

    <p class="pie"><a href="stats.html">Ver estadísticas de un link</a></p>
  </main>

  <script>
    const form = document.getElementById('form');
    const resultado = document.getElementById('resultado');
    const linkCorto = document.getElementById('link-corto');

    const mensaje = document.getElementById('mensaje');

    function mostrarError(texto) {
      mensaje.textContent = texto;
      mensaje.classList.remove('oculto');
      resultado.classList.add('oculto');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value;

      try {
        const res = await fetch('/api/links', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        // Sin esto, un 400 del server pintaba "undefined" como link corto.
        if (!res.ok) {
          mostrarError(data.error || 'No se pudo acortar la url.');
          return;
        }

        const corta = window.location.origin + data.corta;
        linkCorto.textContent = corta;
        linkCorto.href = corta;
        mensaje.classList.add('oculto');
        resultado.classList.remove('oculto');
      } catch {
        mostrarError('No se pudo conectar con el servidor.');
      }
    });

    document.getElementById('copiar').addEventListener('click', async () => {
      const boton = document.getElementById('copiar');
      await navigator.clipboard.writeText(linkCorto.textContent);
      boton.textContent = '¡Copiado!';
      setTimeout(() => { boton.textContent = 'Copiar'; }, 1500);
    });
  </script>
</body>
</html>
