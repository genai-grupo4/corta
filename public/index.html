<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta: acortador interno</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html">
        <img src="logo.png" alt="" class="logo">
        <span>Corta</span>
      </a>
      <nav class="nav">
        <a href="stats.html">Ver estadísticas</a>
      </nav>
    </header>

    <main class="layout">
      <section class="panel panel-principal">
        <h1>Acortar un link</h1>
        <p class="sub">Pegá una URL larga y obtené un código corto para compartir.</p>

        <div class="badges">
          <span class="badge">⚡ Al instante</span>
          <span class="badge">🔒 Uso interno</span>
          <span class="badge">📊 Con estadísticas</span>
        </div>

        <form id="form">
          <input type="url" id="url" placeholder="https://una-url-muy-larga..." required autofocus>
          <button type="submit" id="boton-acortar">Acortar</button>
        </form>

        <div id="resultado" class="resultado oculto">
          <p class="resultado-etiqueta">Tu link corto</p>
          <div class="resultado-link-fila">
            <a id="link-corto" href="#" target="_blank" rel="noopener"></a>
            <button id="copiar" type="button" class="btn-secundario">Copiar</button>
          </div>
        </div>
      </section>

      <aside class="panel panel-historial">
        <div class="panel-historial-header">
          <h2>Historial</h2>
          <button id="limpiar-historial" type="button" class="btn-texto oculto">Borrar</button>
        </div>
        <p class="sub sub-chica">Se guarda solo en este navegador.</p>

        <p id="historial-vacio" class="historial-vacio">Todavía no acortaste ningún link acá.</p>
        <ul id="historial-lista" class="historial-lista"></ul>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast">Copiado al portapapeles</div>

  <script>
    const CLAVE_HISTORIAL = 'corta_historial';
    const MAX_HISTORIAL = 20;

    const form = document.getElementById('form');
    const resultado = document.getElementById('resultado');
    const linkCorto = document.getElementById('link-corto');
    const historialLista = document.getElementById('historial-lista');
    const historialVacio = document.getElementById('historial-vacio');
    const limpiarBtn = document.getElementById('limpiar-historial');
    const botonAcortar = document.getElementById('boton-acortar');
    const toast = document.getElementById('toast');

    let toastTimeout;
    function mostrarToast(texto) {
      toast.textContent = texto;
      toast.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('visible'), 2000);
    }

    function leerHistorial() {
      try {
        return JSON.parse(localStorage.getItem(CLAVE_HISTORIAL)) || [];
      } catch {
        return [];
      }
    }

    function guardarHistorial(items) {
      localStorage.setItem(CLAVE_HISTORIAL, JSON.stringify(items));
    }

    function formatearFecha(iso) {
      return new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function renderHistorial() {
      const items = leerHistorial();
      historialLista.innerHTML = '';
      historialVacio.classList.toggle('oculto', items.length > 0);
      limpiarBtn.classList.toggle('oculto', items.length === 0);

      items.forEach((item, indice) => {
        const li = document.createElement('li');
        li.className = 'historial-item';
        li.style.animationDelay = `${Math.min(indice, 10) * 40}ms`;

        const info = document.createElement('div');
        info.className = 'historial-item-info';

        const codigoLink = document.createElement('a');
        codigoLink.className = 'historial-codigo';
        codigoLink.href = item.corta;
        codigoLink.target = '_blank';
        codigoLink.rel = 'noopener';
        codigoLink.textContent = item.corta;

        const urlSpan = document.createElement('span');
        urlSpan.className = 'historial-url';
        urlSpan.title = item.url;
        urlSpan.textContent = item.url;

        info.append(codigoLink, urlSpan);

        const acciones = document.createElement('div');
        acciones.className = 'historial-item-acciones';

        const fecha = document.createElement('span');
        fecha.className = 'historial-fecha';
        fecha.textContent = formatearFecha(item.creado);

        const statsLink = document.createElement('a');
        statsLink.className = 'historial-stats';
        statsLink.href = `stats.html?codigo=${encodeURIComponent(item.codigo)}`;
        statsLink.textContent = 'Stats';

        acciones.append(fecha, statsLink);

        li.append(info, acciones);
        historialLista.appendChild(li);
      });
    }

    function agregarAlHistorial(item) {
      const items = leerHistorial();
      items.unshift(item);
      guardarHistorial(items.slice(0, MAX_HISTORIAL));
      renderHistorial();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultado.classList.add('oculto');
      botonAcortar.disabled = true;
      botonAcortar.innerHTML = '<span class="spinner"></span>Acortando...';

      try {
        const url = document.getElementById('url').value;
        const res = await fetch('/api/links', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!res.ok) {
          const { error } = await res.json().catch(() => ({}));
          mostrarToast(error || 'No se pudo acortar ese link');
          return;
        }

        const data = await res.json();
        const corta = window.location.origin + data.corta;
        linkCorto.textContent = corta;
        linkCorto.href = corta;
        resultado.classList.remove('oculto');

        agregarAlHistorial({ codigo: data.codigo, corta: data.corta, url, creado: new Date().toISOString() });
        document.getElementById('url').value = '';
      } finally {
        botonAcortar.disabled = false;
        botonAcortar.textContent = 'Acortar';
      }
    });

    const copiarBtn = document.getElementById('copiar');
    copiarBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(linkCorto.textContent);
      copiarBtn.textContent = '¡Copiado!';
      copiarBtn.classList.add('copiado');
      mostrarToast('Copiado al portapapeles');
      setTimeout(() => {
        copiarBtn.textContent = 'Copiar';
        copiarBtn.classList.remove('copiado');
      }, 1500);
    });

    limpiarBtn.addEventListener('click', () => {
      guardarHistorial([]);
      renderHistorial();
    });

    renderHistorial();
  </script>
</body>
</html>
